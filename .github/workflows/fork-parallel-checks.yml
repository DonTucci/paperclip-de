name: Deutscher Fork parallel prüfen

on:
  workflow_dispatch:
    inputs:
      test_group:
        description: "Zu prüfender Bereich"
        required: true
        default: all
        type: choice
        options:
          - all
          - server-1
          - workspaces-a
          - serialized-2
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    if: ${{ inputs.test_group == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server 1
            id: server-1
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 0 --shard-count 5
          - name: Server 2
            id: server-2
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 1 --shard-count 5
          - name: Server 3
            id: server-3
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 2 --shard-count 5
          - name: Server 4
            id: server-4
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 3 --shard-count 5
          - name: Server 5
            id: server-5
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 4 --shard-count 5
          - name: Workspaces A
            id: workspaces-a
            command: node scripts/run-vitest-stable.mjs --mode general --group general-workspaces-a
          - name: Workspaces B
            id: workspaces-b
            command: node scripts/run-vitest-stable.mjs --mode general --group general-workspaces-b
          - name: Serialized 1
            id: serialized-1
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 0 --shard-count 4
          - name: Serialized 2
            id: serialized-2
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 1 --shard-count 4
          - name: Serialized 3
            id: serialized-3
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 2 --shard-count 4
          - name: Serialized 4
            id: serialized-4
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 3 --shard-count 4
    runs-on: ubuntu-latest
    timeout-minutes: 180
    name: Tests – ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - run: ${{ matrix.command }}

  targeted-test:
    if: ${{ inputs.test_group != 'all' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    name: Tests – ${{ inputs.test_group }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - name: Gewählten Bereich prüfen
        run: |
          case "${{ inputs.test_group }}" in
            server-1)
              node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 0 --shard-count 5
              ;;
            workspaces-a)
              node scripts/run-vitest-stable.mjs --mode general --group general-workspaces-a
              ;;
            serialized-2)
              node scripts/run-vitest-stable.mjs --mode serialized --shard-index 1 --shard-count 4
              ;;
            *)
              echo "Unbekannter Prüfbereich: ${{ inputs.test_group }}" >&2
              exit 1
              ;;
          esac
