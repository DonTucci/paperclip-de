name: Deutscher Fork parallel prüfen

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Server 1
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 0 --shard-count 5
          - name: Server 2
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 1 --shard-count 5
          - name: Server 3
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 2 --shard-count 5
          - name: Server 4
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 3 --shard-count 5
          - name: Server 5
            command: node scripts/run-vitest-stable.mjs --mode general --group general-server --shard-index 4 --shard-count 5
          - name: Workspaces A
            command: node scripts/run-vitest-stable.mjs --mode general --group general-workspaces-a
          - name: Workspaces B
            command: node scripts/run-vitest-stable.mjs --mode general --group general-workspaces-b
          - name: Serialized 1
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 0 --shard-count 4
          - name: Serialized 2
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 1 --shard-count 4
          - name: Serialized 3
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 2 --shard-count 4
          - name: Serialized 4
            command: node scripts/run-vitest-stable.mjs --mode serialized --shard-index 3 --shard-count 4
    runs-on: ubuntu-latest
    timeout-minutes: 180
    name: Tests – ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @paperclipai/plugin-sdk ensure-build-deps
      - run: ${{ matrix.command }}
